<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | Cey Sweet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Cey Sweet</h1>
        <p>Her gün <strong>taze</strong> ve <em>el yapımı</em> tatlılar.</p>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="hakkimda.html">Hakkımızda</a>
            <a href="iletisim.html">İletişim</a>
        </nav>
    </header>

    <main>
        <h2>İletişim</h2>
        <p>Sipariş ve sorularınız için bize ulaşın.</p>
        <p>E-posta: <a href="mailto:ceysweet@gmail.com">ceysweet@gmail.com</a></p>

        <section id="saatler">
            <h2>Çalışma Saatlerimiz</h2>
            <table>
                <caption>Çalışma Saatleri</caption>
                <thead>
                    <tr><th>Gün</th><th>Saat</th></tr>
                </thead>
                <tbody>
                    <tr><td>Hafta içi</td><td>09:00–21:00</td></tr>
                    <tr><td>Hafta sonu</td><td>10:00–22:00</td></tr>
                </tbody>
            </table>
        </section>

        <section id="form">
            <h2>Bize Yazın</h2>
            <form>
                <label for="ad">Ad Soyad *</label>
                <input type="text" id="ad" name="ad" required>

                <label for="eposta">E-posta *</label>
                <input type="email" id="eposta" name="eposta"
                       placeholder="ad@ornek.com" required>

                <label for="tatli">Tatlı seçimi</label>
                <select id="tatli" name="tatli">
                    <option value="profiterol">Profiterol</option>
                    <option value="cupcake">Çikolatalı Cupcake</option>
                    <option value="kruvasan">Kruvasan</option>
                </select>

                <label for="mesaj">Mesaj</label>
                <textarea id="mesaj" name="mesaj" rows="4"></textarea>

                <button type="submit">Gönder</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Cey Sweet</p>
    </footer>
</body>
</html>
